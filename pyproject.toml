[build-system]
requires = ["uv_build>=0.9.26,<0.12"]
build-backend = "uv_build"

[project]
name = "droidock"
version = "0.1.1"
description = "Reusable Android connection management with an interactive CLI."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["android", "adb", "cli", "tailscale", "wireless-debugging"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
]
dependencies = [
  "adbutils>=2.12,<3",
  "filelock>=3.18,<4",
  "platformdirs>=4,<5",
  "questionary>=2.1,<3",
  "rich>=14,<16",
  "typer>=0.21,<1",
  "zeroconf>=0.150,<1",
]

[project.scripts]
droidock = "droidock.cli:main"

[project.urls]
Repository = "https://github.com/c0sogi/droidock"
Issues = "https://github.com/c0sogi/droidock/issues"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12",
    "pyright>=1.1.408",
    "isort>=6,<8",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["droidock"]
src_paths = ["src"]
skip_gitignore = true

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
